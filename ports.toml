# Registry of upstream logic ported into this codebase.
#
# Every Lua chunk that REIMPLEMENTS an upstream function (rather than calling
# it) must be registered here. `cargo test --test ports_sync` extracts each
# anchored snippet from the pinned upstream submodule, hashes it, and fails
# when upstream changed a function we ported - turning silent drift into a
# review list. See CLAUDE.md "Upstream usage policy" and
# docs/upstream-upgrade.md.
#
# When ports_sync fails after a pin bump:
#   1. Diff the upstream function between the old and new pins.
#   2. Re-sync the port (or record the difference in DIVERGENCES.md if the
#      divergence is intentional).
#   3. Update `sha256` to the value printed by the test.
#
# Snippet extraction: from the first line containing `anchor` up to either
# the first line containing `end_anchor` (exclusive), or the `end` keyword at
# the anchor line's indentation. Lines are trimmed of trailing whitespace.
#
# `status` is documentation: "faithful" ports track upstream byte-for-byte in
# behavior; "diverged" ports intentionally differ (list the differences in
# DIVERGENCES.md) but still want review when upstream moves.

